
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="340" viewBox="0 0 1000 340">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="60%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="nebula">
      <stop offset="0%" stop-color="#a0a0a0" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#a0a0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue">
      <stop offset="0%" stop-color="#bdbdbd" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#bdbdbd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink">
      <stop offset="0%" stop-color="#858585" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#858585" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="700" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-400 0" to="400 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bdbdbd"/>
      <stop offset="50%" stop-color="#858585"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="55%" stop-color="#858585"/>
      <stop offset="100%" stop-color="#404040"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect width="1000" height="340" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="url(#bg)"/>

    <ellipse cx="200" cy="140" rx="280" ry="130" fill="url(#blue)">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 20;0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="520" cy="110" rx="300" ry="150" fill="url(#nebula)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-70 25;0 0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;1;.7" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="850" cy="180" rx="280" ry="140" fill="url(#pink)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 -20;0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="500" cy="320" rx="320" ry="100" fill="url(#blue)">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 -10;0 0" dur="12s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="#ffffff" opacity=".85">
      <circle cx="25" cy="30" r="1.5"/><circle cx="75" cy="90" r="1"/><circle cx="130" cy="45" r="1.5"/>
      <circle cx="190" cy="215" r="1"/><circle cx="240" cy="35" r="1.5"/><circle cx="300" cy="260" r="1"/>
      <circle cx="350" cy="65" r="1.5"/><circle cx="410" cy="25" r="1"/><circle cx="460" cy="240" r="1.5"/>
      <circle cx="530" cy="45" r="1"/><circle cx="590" cy="215" r="1.5"/><circle cx="650" cy="30" r="1"/>
      <circle cx="710" cy="265" r="1.5"/><circle cx="760" cy="65" r="1"/><circle cx="820" cy="230" r="1.5"/>
      <circle cx="880" cy="35" r="1"/><circle cx="940" cy="110" r="1.5"/><circle cx="975" cy="250" r="1"/>
      <circle cx="55" cy="275" r="1.5"/><circle cx="160" cy="160" r="1"/><circle cx="275" cy="125" r="1"/>
      <circle cx="385" cy="195" r="1"/><circle cx="490" cy="115" r="1.5"/><circle cx="620" cy="95" r="1"/>
      <circle cx="735" cy="165" r="1"/><circle cx="850" cy="125" r="1.5"/><circle cx="925" cy="195" r="1"/>
      <animate attributeName="opacity" values=".5;.95;.5" dur="5s" repeatCount="indefinite"/>
    </g>

    <g fill="#f2f2f2" filter="url(#softGlow)">
      <circle cx="100" cy="120" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="80" r="2.5"><animate attributeName="opacity" values="1;.15;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="285" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="550" cy="55" r="2.5"><animate attributeName="opacity" values="1;.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="125" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="45" r="2.5"><animate attributeName="opacity" values="1;.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="160" r="2.5"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="270" r="2"><animate attributeName="opacity" values="1;.1;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="750" cy="290" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <g fill="#ffffff" filter="url(#softGlow)">
      <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4Z" transform="translate(150 92)">
        <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="90" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4Z" transform="translate(600 40) scale(.7)">
        <animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="-90" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4Z" transform="translate(350 200) scale(.6)">
        <animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(80 20) rotate(25)">
      <line x1="-90" y1="0" x2="0" y2="0" stroke="url(#trail)" stroke-width="2" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="420 0" dur="5s" repeatCount="indefinite"/>
      </line>
    </g>
    <g transform="translate(520 10) rotate(30)">
      <line x1="-80" y1="0" x2="0" y2="0" stroke="url(#trail)" stroke-width="2" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="380 0" dur="6s" begin="2.5s" repeatCount="indefinite"/>
      </line>
    </g>
    <g transform="translate(250 5) rotate(35)">
      <line x1="-70" y1="0" x2="0" y2="0" stroke="url(#trail)" stroke-width="1.6" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="7s" begin="4.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="320 0" dur="7s" begin="4.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <g transform="translate(895 85)">
      <ellipse rx="52" ry="14" fill="none" stroke="#c0c0c0" stroke-opacity=".35" stroke-width="2" transform="rotate(-22)"/>
      <circle r="26" fill="url(#planet)" filter="url(#softGlow)"/>
      <path d="M-52 0 A52 14 0 0 0 52 0" fill="none" stroke="#e0e0e0" stroke-opacity=".6" stroke-width="2" transform="rotate(-22)"/>
      <circle r="4" fill="#f2f2f2" filter="url(#softGlow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M-62 0 A62 22 0 1 1 62 0 A62 22 0 1 1 -62 0"/>
      </circle>
      <animateTransform attributeName="transform" type="translate" values="895 85;895 78;895 85" dur="6s" repeatCount="indefinite"/>
    </g>

    <text x="500" y="150" text-anchor="middle" font-family="Verdana, sans-serif" font-size="62" font-weight="bold" letter-spacing="6" fill="url(#nameGrad)" filter="url(#glow)">KIRUBHA</text>

    <text x="500" y="187" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" letter-spacing="5" fill="#c0c0c0">✦ DEVELOPER • DREAMER • EXPLORER ✦</text>

    <g font-family="Verdana, sans-serif" font-size="14" letter-spacing="3" text-anchor="middle" fill="#f2f2f2">
      <text x="500" y="220" opacity="0">FULL-STACK DEVELOPMENT
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.28;.34;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="220" opacity="0">MACHINE LEARNING
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.28;.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="220" opacity="0">BUILDING THINGS THAT MATTER
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.28;.34;1" dur="9s" begin="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <g font-family="Verdana, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      <g>
        <rect x="140" y="250" width="110" height="30" rx="15" fill="#bdbdbd" fill-opacity=".12" stroke="#bdbdbd" stroke-opacity=".7"/>
        <text x="195" y="270" fill="#f2f2f2">C++</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="270" y="250" width="110" height="30" rx="15" fill="#a0a0a0" fill-opacity=".12" stroke="#a0a0a0" stroke-opacity=".7"/>
        <text x="325" y="270" fill="#dedede">React</text>
        <animateTransform attributeName="transform" type="translate" values="0 -4;0 2;0 -4" dur="3.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="400" y="250" width="110" height="30" rx="15" fill="#858585" fill-opacity=".12" stroke="#858585" stroke-opacity=".7"/>
        <text x="455" y="270" fill="#eeeeee">React Native</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.8s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="530" y="250" width="110" height="30" rx="15" fill="#bdbdbd" fill-opacity=".12" stroke="#bdbdbd" stroke-opacity=".7"/>
        <text x="585" y="270" fill="#f2f2f2">FastAPI</text>
        <animateTransform attributeName="transform" type="translate" values="0 -3;0 3;0 -3" dur="3.2s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="660" y="250" width="110" height="30" rx="15" fill="#a0a0a0" fill-opacity=".12" stroke="#a0a0a0" stroke-opacity=".7"/>
        <text x="715" y="270" fill="#dedede">Docker</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <path d="M0 318 q62.5 -18 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 V340 H0Z" fill="#a0a0a0" fill-opacity=".12">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-250 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0 326 q62.5 14 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 V340 H0Z" fill="#bdbdbd" fill-opacity=".12">
      <animateTransform attributeName="transform" type="translate" from="-250 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="2" y="2" width="996" height="336" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-opacity=".35"/>
  <rect x="2" y="2" width="996" height="336" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="180 2800" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2980" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
